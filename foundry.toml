[profile.default]
src = "contracts/solidity"
out = "out"
libs = ["lib"]
test = "test"
script = "scripts/solidity"
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./" }]

[profile.ci]
src = "contracts/solidity"
test = "test"
fuzz = { runs = 256 }
invariant = { runs = 64 }
verbosity = 2

[fmt]
line_length = 100
tab_width = 4
quote_style = "double"

[rpc_endpoints]
arbitrum_sepolia = "${ARB_SEPOLIA_RPC}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC}"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", chain = 421614 }
