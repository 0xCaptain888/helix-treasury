name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solidity:
    name: Forge (Solidity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install forge-std
        run: |
          forge install foundry-rs/forge-std --no-commit
          forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-commit

      - name: Show forge version
        run: forge --version

      - name: Build contracts
        run: forge build --sizes
        env:
          FOUNDRY_PROFILE: ci

      - name: Check Solidity formatting
        run: forge fmt --check

      - name: Run tests
        run: forge test -vvv --gas-report 2>&1 | tee test-output.txt
        env:
          FOUNDRY_PROFILE: ci

      - name: Check test results
        run: |
          if grep -q "FAIL" test-output.txt; then
            echo "Some tests FAILED"
            exit 1
          fi
          echo "All tests passed"

      - name: Upload test output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-test-results
          path: test-output.txt

  stylus:
    name: Stylus PolicyEngine (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/stylus/policy-engine
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2024-05-20
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/stylus/policy-engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/stylus/policy-engine/Cargo.lock') }}

      - name: Build (native)
        run: cargo build

      - name: Build (WASM)
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Clippy lint
        run: cargo clippy -- -D warnings

      - name: Run unit tests
        run: cargo test -- --nocapture

  typescript:
    name: TypeScript (Agent + SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build --workspace=@helix-treasury/sdk

      - name: Build Agent
        run: npm run build --workspace=@helix-treasury/agent

      - name: Run Agent/SDK tests
        run: npm test --workspaces --if-present

  status:
    name: All checks
    runs-on: ubuntu-latest
    needs: [solidity, stylus, typescript]
    if: always()
    steps:
      - name: Report status
        run: |
          if [[ "${{ needs.solidity.result }}" == "success" ]] && \
             [[ "${{ needs.stylus.result }}" == "success" ]] && \
             [[ "${{ needs.typescript.result }}" == "success" ]]; then
            echo "All CI checks passed"
          else
            echo "One or more checks failed"
            echo "Solidity: ${{ needs.solidity.result }}"
            echo "Stylus:   ${{ needs.stylus.result }}"
            echo "TS:       ${{ needs.typescript.result }}"
            exit 1
          fi
