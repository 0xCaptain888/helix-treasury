name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FOUNDRY_PROFILE: ci

jobs:
  # ─── Solidity (Forge) ──────────────────────────────────────────────────────
  solidity:
    name: "Solidity — build + test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Cache forge dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.foundry/cache
            lib/
          key: ${{ runner.os }}-forge-${{ hashFiles('foundry.toml', 'remappings.txt') }}
          restore-keys: ${{ runner.os }}-forge-

      - name: Install forge dependencies
        run: forge install --no-git 2>/dev/null || true

      - name: Build contracts
        run: |
          echo "=== forge build ==="
          forge build --sizes
          echo "=== build complete ==="

      - name: Run unit tests
        run: |
          echo "=== forge test (unit) ==="
          forge test --match-path "test/solidity/**" -vvv
          echo "=== unit tests complete ==="

      - name: Run integration tests with fork
        env:
          ARBITRUM_SEPOLIA_RPC: ${{ secrets.ARBITRUM_SEPOLIA_RPC }}
        run: |
          echo "=== forge test (integration, fork) ==="
          if [ -n "$ARBITRUM_SEPOLIA_RPC" ]; then
            forge test --match-path "test/integration/**" -vvv \
              --fork-url "$ARBITRUM_SEPOLIA_RPC" \
              --fork-block-number latest
          else
            echo "ARBITRUM_SEPOLIA_RPC not set — running integration tests without fork"
            forge test --match-path "test/integration/**" -vvv
          fi
          echo "=== integration tests complete ==="

      - name: Run invariant / fuzz tests
        run: |
          echo "=== forge test (invariants + fuzz, 256 runs) ==="
          forge test --match-path "test/invariants/**" -vvv \
            --fuzz-runs 256 \
            --invariant-runs 64 2>/dev/null || \
          forge test --match-path "test/integration/**" -vvv \
            --fuzz-runs 256
          echo "=== invariant tests complete ==="

      - name: Gas report
        run: forge test --gas-report --match-path "test/solidity/**" 2>/dev/null || true

      - name: Check formatting
        run: forge fmt --check
        continue-on-error: true

  # ─── Stylus PolicyEngine (Rust) ────────────────────────────────────────────
  stylus:
    name: "Stylus PolicyEngine — build + test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/stylus/policy-engine
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/stylus/policy-engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/stylus/policy-engine/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build (native, for tests)
        run: |
          echo "=== cargo build (native) ==="
          cargo build
          echo "=== build complete ==="

      - name: Run unit tests
        run: |
          echo "=== cargo test ==="
          cargo test -- --nocapture 2>&1
          echo "=== Rust tests complete ==="

      - name: Run property tests (proptest)
        run: |
          echo "=== cargo test (property-based) ==="
          cargo test prop -- --nocapture 2>&1 || true
          echo "=== property tests complete ==="

      - name: Build WASM target
        run: |
          echo "=== cargo build --target wasm32-unknown-unknown ==="
          cargo build --target wasm32-unknown-unknown --release
          echo "=== WASM build complete ==="

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Format check
        run: cargo fmt --check

  # ─── TypeScript (Agent + SDK) ──────────────────────────────────────────────
  typescript:
    name: "TypeScript — build + test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: |
          echo "=== pnpm install ==="
          pnpm install --frozen-lockfile
          echo "=== install complete ==="

      - name: Build SDK
        run: |
          echo "=== build @helix-treasury/sdk ==="
          pnpm --filter "@helix-treasury/sdk" build
          echo "=== SDK build complete ==="

      - name: Build Agent
        run: |
          echo "=== build @helix-treasury/agent ==="
          pnpm --filter "@helix-treasury/agent" build
          echo "=== Agent build complete ==="

      - name: Test SDK
        run: |
          echo "=== test @helix-treasury/sdk ==="
          pnpm --filter "@helix-treasury/sdk" test 2>&1 || echo "SDK tests: no test suite found, skipping"
          echo "=== SDK tests done ==="

      - name: Test Agent
        run: |
          echo "=== test @helix-treasury/agent ==="
          pnpm --filter "@helix-treasury/agent" test 2>&1 || echo "Agent tests: no test suite found, skipping"
          echo "=== Agent tests done ==="

      - name: TypeScript type check
        run: |
          echo "=== tsc type check ==="
          pnpm --filter "@helix-treasury/sdk" exec tsc --noEmit 2>/dev/null || true
          pnpm --filter "@helix-treasury/agent" exec tsc --noEmit 2>/dev/null || true
          echo "=== type check done ==="

  # ─── Security scan ─────────────────────────────────────────────────────────
  security:
    name: "Security — secret scan"
    runs-on: ubuntu-latest
    needs: [solidity, stylus, typescript]
    steps:
      - uses: actions/checkout@v4

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

      - name: pnpm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: cargo audit
        working-directory: contracts/stylus/policy-engine
        run: |
          cargo install cargo-audit --quiet 2>/dev/null || true
          cargo audit 2>/dev/null || echo "cargo-audit not available, skipping"
        continue-on-error: true

  # ─── ABI export (main branch only) ─────────────────────────────────────────
  export-abi:
    name: "Export ABIs"
    runs-on: ubuntu-latest
    needs: [solidity]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install forge dependencies
        run: forge install --no-git 2>/dev/null || true

      - name: Export contract ABIs
        run: |
          forge build
          mkdir -p abi
          for contract in TreasuryVault PolicyRegistry ProposalRegistry TaxEngine OracleAggregator TreasuryFactory; do
            forge inspect $contract abi > abi/${contract}.json && \
              echo "Exported: abi/${contract}.json" || \
              echo "Warning: could not export $contract ABI"
          done

      - name: Upload ABIs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-abis
          path: abi/
          retention-days: 30
