name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FOUNDRY_PROFILE: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Solidity ──────────────────────────────────────────────────────────────
  solidity:
    name: Solidity (Forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install forge-std
        run: |
          forge install foundry-rs/forge-std --no-commit
          forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-commit

      - name: Show forge version
        run: forge --version

      - name: Build contracts
        run: forge build --sizes

      - name: Check formatting
        run: forge fmt --check

      - name: Run tests
        run: forge test -vvv --gas-report 2>&1 | tee test-output.txt

      - name: Check test results
        run: |
          if grep -q "FAIL" test-output.txt; then
            echo "Some tests FAILED"
            exit 1
          fi
          echo "All tests passed"

      - name: Slither static analysis
        uses: crytic/slither-action@v0.4.0
        with:
          target: contracts/solidity/
          slither-args: >
            --exclude-dependencies
            --checklist
            --markdown-root ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/
        continue-on-error: true  # Warnings allowed; only block on High/Critical

      - name: Upload test output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-test-results
          path: test-output.txt

  # ─── Stylus (Rust) ─────────────────────────────────────────────────────────
  stylus:
    name: Stylus PolicyEngine (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/stylus/policy-engine
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2024-05-20
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/stylus/policy-engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/stylus/policy-engine/Cargo.lock') }}

      - name: Build (native, for tests)
        run: cargo build

      - name: Run unit tests
        run: cargo test -- --nocapture

      - name: Build (WASM target for Stylus)
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Format check
        run: cargo fmt --check

  # ─── TypeScript (Agent + SDK) ──────────────────────────────────────────────
  typescript:
    name: TypeScript (Agent + SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build --workspace=@helix-treasury/sdk

      - name: Build Agent
        run: npm run build --workspace=@helix-treasury/agent

      - name: Run Agent tests
        run: npm test --workspace=@helix-treasury/agent

      - name: Run SDK tests
        run: npm test --workspace=@helix-treasury/sdk

      - name: Lint
        run: npm run lint --workspaces --if-present

  # ─── Security gate ─────────────────────────────────────────────────────────
  security-check:
    name: Security scan
    runs-on: ubuntu-latest
    needs: [solidity, stylus, typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Dependency audit (npm)
        run: npm audit --audit-level=high

      - name: Dependency audit (cargo)
        working-directory: contracts/stylus/policy-engine
        run: cargo audit
        continue-on-error: true  # Advisory; not blocking

  # ─── ABI export ────────────────────────────────────────────────────────────
  export-abi:
    name: Export ABIs
    runs-on: ubuntu-latest
    needs: [solidity]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build and export ABIs
        run: |
          forge build
          mkdir -p abi
          for contract in TreasuryVault PolicyRegistry ProposalRegistry TaxEngine OracleAggregator TreasuryFactory; do
            forge inspect $contract abi > abi/${contract}.json
            echo "Exported: abi/${contract}.json"
          done

      - name: Upload ABIs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-abis
          path: abi/
          retention-days: 30
