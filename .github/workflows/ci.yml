name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FOUNDRY_PROFILE: ci

jobs:
  # ─── Solidity ──────────────────────────────────────────────────────────────
  solidity:
    name: Solidity (Forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Build contracts
        run: forge build --sizes

      - name: Run tests
        run: forge test -vvv --gas-report

      - name: Check formatting
        run: forge fmt --check

      - name: Slither static analysis
        uses: crytic/slither-action@v0.4.0
        with:
          target: contracts/solidity/
          slither-args: >
            --exclude-dependencies
            --checklist
            --markdown-root ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/
        continue-on-error: true  # Warnings allowed; only block on High/Critical

  # ─── Stylus (Rust) ─────────────────────────────────────────────────────────
  stylus:
    name: Stylus PolicyEngine (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/stylus/policy-engine
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2024-05-20
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (native, for tests)
        run: cargo build

      - name: Run unit tests
        run: cargo test

      - name: Build (WASM target for Stylus)
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Format check
        run: cargo fmt --check

  # ─── TypeScript (Agent + SDK) ──────────────────────────────────────────────
  typescript:
    name: TypeScript (Agent + SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @helix/sdk build

      - name: Build Agent
        run: pnpm --filter @helix/agent build

      - name: Run Agent tests
        run: pnpm --filter @helix/agent test

      - name: Run SDK tests
        run: pnpm --filter @helix/sdk test

      - name: Lint
        run: pnpm -r lint

  # ─── Security gate ─────────────────────────────────────────────────────────
  security-check:
    name: Security scan
    runs-on: ubuntu-latest
    needs: [solidity, stylus, typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Dependency audit (npm)
        run: pnpm audit --audit-level=high

      - name: Dependency audit (cargo)
        working-directory: contracts/stylus/policy-engine
        run: cargo audit
        continue-on-error: true  # Advisory; not blocking

  # ─── ABI export ────────────────────────────────────────────────────────────
  export-abi:
    name: Export ABIs
    runs-on: ubuntu-latest
    needs: [solidity]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build and export ABIs
        run: |
          forge build
          mkdir -p abi
          for contract in TreasuryVault PolicyRegistry ProposalRegistry TaxEngine OracleAggregator TreasuryFactory; do
            forge inspect $contract abi > abi/${contract}.json
            echo "Exported: abi/${contract}.json"
          done

      - name: Upload ABIs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-abis
          path: abi/
          retention-days: 30
