[package]
name = "helix-policy-engine"
version = "0.5.0"
edition = "2021"
authors = ["Helix Contributors"]
license = "MIT"
description = "Stylus-based policy evaluator for Helix Treasury OS"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stylus-sdk = "0.6"
alloy-primitives = "0.7"
alloy-sol-types = "0.7"
fixed = "1.27"
heapless = "0.8"

[dev-dependencies]
proptest = "1.5"

[features]
default = []
export-abi = ["stylus-sdk/export-abi"]
debug = ["stylus-sdk/debug"]

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "z"

[profile.dev]
panic = "abort"
