[package]
name = "helix-policy-engine"
version = "0.5.0"
edition = "2021"
authors = ["Helix Contributors"]
license = "MIT"
description = "Stylus-based policy evaluator for Helix Treasury OS"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stylus-sdk = { version = "0.6.0", default-features = false }
alloy-primitives = { version = "0.7.6", default-features = false, features = ["rlp"] }
alloy-sol-types = { version = "0.7.6", default-features = false }
mini-alloc = "0.4.2"
fixed = "1.27"
heapless = "0.8"

[dev-dependencies]
stylus-sdk = { version = "0.6.0", features = ["debug"] }
alloy-primitives = { version = "0.7.6", features = ["std"] }
proptest = "1.5"
tiny-keccak = { version = "2.0", features = ["keccak"] }

[features]
default = []
export-abi = ["stylus-sdk/export-abi"]
debug = ["stylus-sdk/debug"]
std = ["alloy-primitives/std"]

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "z"

[profile.dev]
panic = "abort"
